version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=myapp_db
    ports:
      - "5432:5432" # PCの5432ポートをコンテナに繋ぐ
    volumes:
      - ./postgres_data:/var/lib/postgresql/data # データをPC内に保存