<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
</head>
<body>

  <h1>Todo App</h1>

  <!--  登録画面 -->
  <div id="registerArea">
    <h2>Register</h2>
    <input id="reg_name" placeholder="name">
    <input id="reg_email" placeholder="email">
    <input id="reg_password" placeholder="password">
    <br> <button onclick="register()">登録</button>
  </div>

  <!-- ログイン画面 -->
  <div id="loginArea">
    <h2>Login</h2>
    <input id="login_email" placeholder="email">
    <input type="password" id="login_password" placeholder="password">
    <button onclick="login()">ログイン</button>
    <br> <button onclick="shiftArea('register')">または初回登録</button>
  </div>

  <!-- TODO画面 -->
  <div id="todoArea" style="display:none;">
    <h2>Todo</h2>
    <input id="title" placeholder="todo入力">
    <button onclick="addTodo()">追加</button>
    <br> <button onclick="shiftArea('login')">サインアウト</button>
    <ul id="list"></ul>
  </div>

  <script>
    //　今ブラウザを表示しているサイトの住所を自動で取得
    const API_URL = window.location.origin;

    // 登録
    async function register() {
      const name = document.getElementById('reg_name').value;
      const email = document.getElementById('reg_email').value;
      const password = document.getElementById('reg_password').value;

      const res = await fetch(`${API_URL}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });

      if (res.ok) {
        // ログインへ画面切り替え
        shiftArea('login');
      } else {
        const errorData = await res.json();
        alert('Registration failed: ' + errorData.error);
      }
    }

    // ログイン
    async function login() {
      const email = document.getElementById('login_email').value;
      const password = document.getElementById('login_password').value;

      const res = await fetch(`${API_URL}/login`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      // Check if userID is valid
      if (!data.userId) {
        alert('No user ID returned!');
        return false;
      }

      // userId保存
      localStorage.setItem('userId', data.userId);

      // todo画面へ切り替え
      shiftArea('todo');

      getTodos();
    }         

    // todo一覧取得
    async function getTodos() {
      const userId = getUserId();
      const res = await fetch(`${API_URL}/todos?userId=${userId}`);
      const todos = await res.json();

      list = document.getElementById('list');
      list.innerHTML = '';

      todos.forEach(todo => {
        const li = document.createElement('li');
        li.textContent = todo.title;

        // 削除ボタン
        const delBtn = document.createElement('button');
        delBtn.textContent = '削除';
        delBtn.onclick = () => deleteTodo(todo.id);

        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }

    // todo追加
    async function addTodo() {
      const userId = getUserId();
      const title = document.getElementById('title').value;

      await fetch(`${API_URL}/todos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, title })
      });

      // empty todo input
      document.getElementById('title').value = '';

      getTodos();
    }

    // todo削除
    async function deleteTodo(id) {
      await fetch(`${API_URL}/todos/${id}`, {
        method: 'DELETE'
      });

      getTodos();
    }

    // userID取得
    function getUserId() {
      return localStorage.getItem('userId');
    }

    // 画面遷移
    function shiftArea(area) {
      switch (area) {
      case 'register':
        document.getElementById('registerArea').style.display = 'block';
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('todoArea').style.display = 'none'; 
        break;
      case 'login':
        document.getElementById('registerArea').style.display = 'none';
        document.getElementById('loginArea').style.display = 'block';
        document.getElementById('todoArea').style.display = 'none';
        break;
      case 'todo':
        document.getElementById('registerArea').style.display = 'none';
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('todoArea').style.display = 'block';
        break;
      }
    }   

    // 初期表示（ログイン済みチェック
    window.onload = () => {
      shiftArea('login');
    };
  </script>

</body>
</html>
